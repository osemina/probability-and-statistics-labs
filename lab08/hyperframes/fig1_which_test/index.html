<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1640, height=740" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 700; src: url("assets/Montserrat-700.ttf"); }
      @font-face { font-family: "Open Sans"; font-weight: 400; src: url("assets/OpenSans-400.ttf"); }
      @font-face { font-family: "Open Sans"; font-weight: 600; src: url("assets/OpenSans-600.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1640px; height: 740px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 1640px; height: 740px; font-family: "Open Sans", sans-serif; color: #202020; }
      .abs { position: absolute; }
      .lbl { font: 700 26px "Montserrat"; white-space: nowrap; }
      .step { font: 700 22px "Montserrat"; color: #003e67; white-space: nowrap; }
      .sub { font: 400 21px "Open Sans"; color: #5f6368; white-space: nowrap; }
      .rt { font: 600 24px "Open Sans"; color: #202020; }
      .note { font: 400 23px "Open Sans"; color: #5f6368; line-height: 1.45; }
      .eq { font: 600 30px "Open Sans"; color: #003e67; white-space: nowrap; }
      .card { border-radius: 22px; background: #f3f3f0; }
      
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1640" data-height="740">
      <div id="scene" class="clip abs" data-start="0" data-duration="13" style="left:0;top:0;width:1640px;height:740px">
        <div class="abs card" style="left:20px;top:15px;width:1600px;height:710px"></div>
        <div id="q0" class="abs" style="left:620px;top:30px;width:400px;height:70px;opacity:0;border-radius:18px;background:#003e67;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 23px Montserrat;line-height:1.25;padding:0 14px">What do we compare?</div>
        <div id="pr" class="abs" style="left:60px;top:175px;width:400px;height:95px;opacity:0;border-radius:18px;background:#f1e4c6;color:#5a4513;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 23px Montserrat;line-height:1.25;padding:0 14px">z-test for two proportions<span style="font:600 18px Open Sans;margin-top:4px">pooled proportion p₀</span></div>
        <div id="q1" class="abs" style="left:620px;top:175px;width:400px;height:95px;opacity:0;border-radius:18px;background:#003e67;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 23px Montserrat;line-height:1.25;padding:0 14px">Two means:<br>are the samples paired?</div>
        <div id="va" class="abs" style="left:1180px;top:175px;width:400px;height:95px;opacity:0;border-radius:18px;background:#f1e4c6;color:#5a4513;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 23px Montserrat;line-height:1.25;padding:0 14px">F-test for two variances<span style="font:600 18px Open Sans;margin-top:4px">F = s²<sub>X</sub> / s²<sub>Y</sub></span></div>
        <div id="pt" class="abs" style="left:420px;top:330px;width:330px;height:90px;opacity:0;border-radius:18px;background:#f1e4c6;color:#5a4513;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 23px Montserrat;line-height:1.25;padding:0 14px">Paired t-test<span style="font:600 18px Open Sans;margin-top:4px">d = x − y, df = n − 1</span></div>
        <div id="q2" class="abs" style="left:900px;top:330px;width:330px;height:90px;opacity:0;border-radius:18px;background:#003e67;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 23px Montserrat;line-height:1.25;padding:0 14px">Is σ known?</div>
        <div id="zm" class="abs" style="left:690px;top:470px;width:350px;height:90px;opacity:0;border-radius:18px;background:#f1e4c6;color:#5a4513;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 23px Montserrat;line-height:1.25;padding:0 14px">z-test<span style="font:600 18px Open Sans;margin-top:4px">σ<sub>X</sub> and σ<sub>Y</sub> known</span></div>
        <div id="q3" class="abs" style="left:1110px;top:470px;width:360px;height:90px;opacity:0;border-radius:18px;background:#003e67;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 23px Montserrat;line-height:1.25;padding:0 14px">Equal variances?</div>
        <div id="pl" class="abs" style="left:940px;top:610px;width:320px;height:95px;opacity:0;border-radius:18px;background:#f1e4c6;color:#5a4513;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 23px Montserrat;line-height:1.25;padding:0 14px">Pooled t-test<span style="font:600 18px Open Sans;margin-top:4px">df = n<sub>X</sub> + n<sub>Y</sub> − 2</span></div>
        <div id="we" class="abs" style="left:1290px;top:610px;width:310px;height:95px;opacity:0;border-radius:18px;background:#f1e4c6;color:#5a4513;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 23px Montserrat;line-height:1.25;padding:0 14px">Welch’s t-test<span style="font:600 18px Open Sans;margin-top:4px">df = ν (Welch formula)</span></div>
        <svg style="z-index:0" class="abs" style="left:0;top:0" width="1640" height="740"><defs></defs><g id="e1" opacity="0"><path d="M820,100 L820,137.5 L260,137.5 L260,175" fill="none" stroke="#5f6368" stroke-width="3"/><path d="M251,161 L260,175 L269,161" fill="none" stroke="#5f6368" stroke-width="3"/><text x="470" y="128" font-family="Open Sans" font-weight="600" font-size="21" fill="#202020" text-anchor="middle">proportions</text></g><g id="e2" opacity="0"><path d="M820,100 L820,137.5 L820,137.5 L820,175" fill="none" stroke="#5f6368" stroke-width="3"/><path d="M811,161 L820,175 L829,161" fill="none" stroke="#5f6368" stroke-width="3"/><text x="868" y="165" font-family="Open Sans" font-weight="600" font-size="21" fill="#202020" text-anchor="middle">means</text></g><g id="e3" opacity="0"><path d="M820,100 L820,137.5 L1380,137.5 L1380,175" fill="none" stroke="#5f6368" stroke-width="3"/><path d="M1371,161 L1380,175 L1389,161" fill="none" stroke="#5f6368" stroke-width="3"/><text x="1170" y="128" font-family="Open Sans" font-weight="600" font-size="21" fill="#202020" text-anchor="middle">variances</text></g><g id="e4" opacity="0"><path d="M820,270 L820,300.0 L585,300.0 L585,330" fill="none" stroke="#5f6368" stroke-width="3"/><path d="M576,316 L585,330 L594,316" fill="none" stroke="#5f6368" stroke-width="3"/><text x="640" y="291" font-family="Open Sans" font-weight="600" font-size="21" fill="#202020" text-anchor="middle">yes (dependent)</text></g><g id="e5" opacity="0"><path d="M820,270 L820,300.0 L1065,300.0 L1065,330" fill="none" stroke="#5f6368" stroke-width="3"/><path d="M1056,316 L1065,330 L1074,316" fill="none" stroke="#5f6368" stroke-width="3"/><text x="1010" y="291" font-family="Open Sans" font-weight="600" font-size="21" fill="#202020" text-anchor="middle">no (independent)</text></g><g id="e6" opacity="0"><path d="M1065,420 L1065,445.0 L865,445.0 L865,470" fill="none" stroke="#5f6368" stroke-width="3"/><path d="M856,456 L865,470 L874,456" fill="none" stroke="#5f6368" stroke-width="3"/><text x="930" y="437" font-family="Open Sans" font-weight="600" font-size="21" fill="#202020" text-anchor="middle">yes</text></g><g id="e7" opacity="0"><path d="M1065,420 L1065,445.0 L1290,445.0 L1290,470" fill="none" stroke="#5f6368" stroke-width="3"/><path d="M1281,456 L1290,470 L1299,456" fill="none" stroke="#5f6368" stroke-width="3"/><text x="1220" y="437" font-family="Open Sans" font-weight="600" font-size="21" fill="#202020" text-anchor="middle">no</text></g><g id="e8" opacity="0"><path d="M1290,560 L1290,585.0 L1100,585.0 L1100,610" fill="none" stroke="#5f6368" stroke-width="3"/><path d="M1091,596 L1100,610 L1109,596" fill="none" stroke="#5f6368" stroke-width="3"/><text x="1160" y="577" font-family="Open Sans" font-weight="600" font-size="21" fill="#202020" text-anchor="middle">yes</text></g><g id="e9" opacity="0"><path d="M1290,560 L1290,585.0 L1445,585.0 L1445,610" fill="none" stroke="#5f6368" stroke-width="3"/><path d="M1436,596 L1445,610 L1454,596" fill="none" stroke="#5f6368" stroke-width="3"/><text x="1400" y="577" font-family="Open Sans" font-weight="600" font-size="21" fill="#202020" text-anchor="middle">no</text></g></svg>

      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(["#q0"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 0.3);
      tl.to(["#e1"], { opacity: 1, duration: 0.4 }, 1.0);
      tl.fromTo(["#pr"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 1.3);
      tl.to(["#e3"], { opacity: 1, duration: 0.4 }, 2.1);
      tl.fromTo(["#va"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 2.4);
      tl.to(["#e2"], { opacity: 1, duration: 0.4 }, 3.2);
      tl.fromTo(["#q1"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 3.5);
      tl.to(["#e4"], { opacity: 1, duration: 0.4 }, 4.4);
      tl.fromTo(["#pt"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 4.7);
      tl.to(["#e5"], { opacity: 1, duration: 0.4 }, 5.5);
      tl.fromTo(["#q2"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 5.8);
      tl.to(["#e6"], { opacity: 1, duration: 0.4 }, 6.6);
      tl.fromTo(["#zm"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 6.9);
      tl.to(["#e7"], { opacity: 1, duration: 0.4 }, 7.7);
      tl.fromTo(["#q3"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 8.0);
      tl.to(["#e8"], { opacity: 1, duration: 0.4 }, 8.8);
      tl.fromTo(["#pl"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 9.1);
      tl.to(["#e9"], { opacity: 1, duration: 0.4 }, 9.6);
      tl.fromTo(["#we"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 9.9);

      tl.to({}, { duration: 0.01 }, 12.99);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
