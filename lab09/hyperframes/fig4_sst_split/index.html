<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1640, height=740" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 700; src: url("assets/Montserrat-700.ttf"); }
      @font-face { font-family: "Open Sans"; font-weight: 400; src: url("assets/OpenSans-400.ttf"); }
      @font-face { font-family: "Open Sans"; font-weight: 600; src: url("assets/OpenSans-600.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1640px; height: 740px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 1640px; height: 740px; font-family: "Open Sans", sans-serif; color: #202020; }
      .abs { position: absolute; }
      .lbl { font: 700 26px "Montserrat"; white-space: nowrap; }
      .step { font: 700 22px "Montserrat"; color: #003e67; white-space: nowrap; }
      .sub { font: 400 21px "Open Sans"; color: #5f6368; white-space: nowrap; }
      .rt { font: 600 24px "Open Sans"; color: #202020; }
      .note { font: 400 23px "Open Sans"; color: #5f6368; line-height: 1.45; }
      .eq { font: 600 30px "Open Sans"; color: #003e67; white-space: nowrap; }
      .card { border-radius: 22px; background: #f3f3f0; }
      
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1640" data-height="740">
      <div id="scene" class="clip abs" data-start="0" data-duration="10" style="left:0;top:0;width:1640px;height:740px">
        <div class="abs card" style="left:40px;top:30px;width:1120px;height:680px"></div>
        <div class="abs card" style="left:1190px;top:30px;width:410px;height:680px"></div>
        <svg class="abs" style="left:0;top:0" width="1640" height="740"><defs></defs><line x1="120" y1="650.0" x2="1080" y2="650.0" stroke="#5f6368" stroke-width="3"/><line x1="120.0" y1="650.0" x2="120.0" y2="660.0" stroke="#5f6368" stroke-width="2"/><text x="120.0" y="684.0" font-family="Open Sans" font-weight="600" font-size="20" fill="#202020" text-anchor="middle">0</text><line x1="280.0" y1="650.0" x2="280.0" y2="660.0" stroke="#5f6368" stroke-width="2"/><text x="280.0" y="684.0" font-family="Open Sans" font-weight="600" font-size="20" fill="#202020" text-anchor="middle">1</text><line x1="440.0" y1="650.0" x2="440.0" y2="660.0" stroke="#5f6368" stroke-width="2"/><text x="440.0" y="684.0" font-family="Open Sans" font-weight="600" font-size="20" fill="#202020" text-anchor="middle">2</text><line x1="600.0" y1="650.0" x2="600.0" y2="660.0" stroke="#5f6368" stroke-width="2"/><text x="600.0" y="684.0" font-family="Open Sans" font-weight="600" font-size="20" fill="#202020" text-anchor="middle">3</text><line x1="760.0" y1="650.0" x2="760.0" y2="660.0" stroke="#5f6368" stroke-width="2"/><text x="760.0" y="684.0" font-family="Open Sans" font-weight="600" font-size="20" fill="#202020" text-anchor="middle">4</text><line x1="920.0" y1="650.0" x2="920.0" y2="660.0" stroke="#5f6368" stroke-width="2"/><text x="920.0" y="684.0" font-family="Open Sans" font-weight="600" font-size="20" fill="#202020" text-anchor="middle">5</text><line x1="1080.0" y1="650.0" x2="1080.0" y2="660.0" stroke="#5f6368" stroke-width="2"/><text x="1080.0" y="684.0" font-family="Open Sans" font-weight="600" font-size="20" fill="#202020" text-anchor="middle">6</text><line x1="120.0" y1="650.0" x2="120.0" y2="70.0" stroke="#5f6368" stroke-width="3"/><text x="108.0" y="530.9130434782609" font-family="Open Sans" font-weight="600" font-size="20" fill="#202020" text-anchor="end">50</text><text x="108.0" y="404.82608695652175" font-family="Open Sans" font-weight="600" font-size="20" fill="#202020" text-anchor="end">60</text><text x="108.0" y="278.7391304347826" font-family="Open Sans" font-weight="600" font-size="20" fill="#202020" text-anchor="end">70</text><text x="108.0" y="152.6521739130435" font-family="Open Sans" font-weight="600" font-size="20" fill="#202020" text-anchor="end">80</text><text x="1080.0" y="712.0" font-family="Open Sans" font-weight="600" font-size="22" fill="#202020" text-anchor="end">x: hours studied</text><text x="132.0" y="76.0" font-family="Open Sans" font-weight="600" font-size="22" fill="#202020">y: exam score</text><g id="mline" opacity="0"><line x1="152.0" y1="360.0" x2="1048.0" y2="360.0" stroke="#9aa7b4" stroke-width="3" stroke-dasharray="10 8"/><text x="1048.0" y="390.0" font-family="Open Sans" font-weight="700" font-size="22" fill="#6b7a89" text-anchor="end">ȳ = 63</text></g><g id="rline" opacity="0"><line x1="152.0" y1="557.704347826087" x2="1048.0" y2="162.29565217391297" stroke="#b34739" stroke-width="5"/><text x="1040.0" y="148.29565217391297" font-family="Open Sans" font-weight="700" font-size="22" fill="#b34739" text-anchor="end">ŷ = 46.2 + 5.6x</text></g><g id="pts"><circle cx="280.0" cy="498.69565217391306" r="11" fill="#003e67"/><circle cx="440.0" cy="423.04347826086956" r="11" fill="#003e67"/><circle cx="600.0" cy="385.2173913043478" r="11" fill="#003e67"/><circle cx="760.0" cy="271.7391304347826" r="11" fill="#003e67"/><circle cx="920.0" cy="221.304347826087" r="11" fill="#003e67"/></g><g id="tot" opacity="0"><line x1="734.4" y1="360.0" x2="734.4" y2="271.7391304347826" stroke="#003e67" stroke-width="9"/></g><g id="exp" opacity="0"><line x1="760.0" y1="360.0" x2="760.0" y2="289.3913043478262" stroke="#c39a3d" stroke-width="9"/></g><g id="une" opacity="0"><line x1="760.0" y1="289.3913043478262" x2="760.0" y2="271.7391304347826" stroke="#b34739" stroke-width="9"/></g><g id="bar" opacity="0"><rect x="1220" y="520" width="350" height="36" fill="#b34739"/><rect x="1220" y="520" width="343.0" height="36" fill="#c39a3d"/><text x="1232" y="545" font-family="Open Sans" font-weight="700" font-size="20" fill="#ffffff">explained 98%</text></g></svg>
        <div id="h0" class="step abs" style="left:1220px;top:60px;opacity:0;">One point: x = 4, y = 70</div>
        <div id="t1" class="rt abs" style="left:1220px;top:115px;opacity:0;font-size:24px"><span style="color:#003e67">Total:</span> y − ȳ = 7</div>
        <div id="t2" class="rt abs" style="left:1220px;top:165px;opacity:0;font-size:24px;width:360px;white-space:normal"><span style="color:#c39a3d">Explained by the line:</span> ŷ − ȳ = 5.6</div>
        <div id="t3" class="rt abs" style="left:1220px;top:245px;opacity:0;font-size:24px;width:360px;white-space:normal"><span style="color:#b34739">Unexplained (residual):</span> y − ŷ = 1.4</div>
        <div id="h1" class="note abs" style="left:1220px;top:335px;opacity:0;width:350px;white-space:normal;font-weight:600">Square and add over all points:</div>
        <div id="t4" class="rt abs" style="left:1220px;top:410px;opacity:0;font-size:26px;color:#003e67">SST = SSR + SSE<br>320 = 313.6 + 6.4</div>
        <div id="fin" class="rt abs" style="left:1220px;top:580px;opacity:0;font-size:28px;color:#b34739">R² = 313.6 / 320 = 0.98</div>

      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to(["#mline"], { opacity: 1, duration: 0.4 }, 0.3);
      tl.to(["#rline"], { opacity: 1, duration: 0.4 }, 0.9);
      tl.fromTo(["#h0"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 1.4);
      tl.to(["#tot"], { opacity: 1, duration: 0.4 }, 2.0);
      tl.fromTo(["#t1"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 2.2);
      tl.to(["#exp"], { opacity: 1, duration: 0.4 }, 3.2);
      tl.fromTo(["#t2"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 3.4);
      tl.to(["#une"], { opacity: 1, duration: 0.4 }, 4.4);
      tl.fromTo(["#t3"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 4.6);
      tl.fromTo(["#h1", "#t4"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 5.8);
      tl.to(["#bar"], { opacity: 1, duration: 0.6 }, 7.0);
      tl.fromTo(["#fin"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 }, 7.4);

      tl.to({}, { duration: 0.01 }, 9.99);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
